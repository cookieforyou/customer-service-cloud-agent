name: ci

# 《13-工程规范与质量门禁》§4 流水线：build → unit/arch → integration（Testcontainers 自 M0批2 起）
# eval 阶段（promptfoo 门禁）自 M1批6 起按变更触发接入；redteam 夜间任务自 M3 起
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: 编译（build 阶段）
        run: mvn -B -ntp -q compile

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: 单元+架构测试（unit/arch 阶段，ArchUnit 六规则 CI 强制）
        run: mvn -B -ntp -q test

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: 集成验证（integration 阶段；runner 自带 Docker，Testcontainers 用例自 M0批2 起进入）
        run: mvn -B -ntp -q verify
